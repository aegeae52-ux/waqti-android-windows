name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare app files
        shell: bash
        run: |
          mkdir -p windows/app windows/build
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png windows/app/
          cp icon-512.png windows/build/icon.png

      - name: Install
        working-directory: windows
        run: npm install

      - name: Build exe
        working-directory: windows
        run: npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: waqti-windows
          path: windows/dist/*.exe
